name: Refresh BharatWire news

on:
  schedule:
    - cron: "15 * * * *"   # every hour: refresh news.json snapshot for instant page loads
  workflow_dispatch:

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate news.json
        run: node scripts/generate.mjs
        env:
          GENERATE_BRIEFING: "false"   # briefing disabled — news snapshot only, no API cost

      - name: Commit and push
        run: |
          git config user.name "bharatwire-bot"
          git config user.email "bharatwire-bot@users.noreply.github.com"
          for f in news.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || git commit -m "News update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase
          git push
